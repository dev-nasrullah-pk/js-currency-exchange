<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currenies Currecy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        <div class="converter-container">
            <header>
                <div class="svg">
                 <img src="./assests/arrow.svg" alt="">
                </div>
                <h1>Currency Converter</h1>
                <p>Convert Between, PKR, INR and SAR easily and qickly</p>
            </header>
            <div class="converter-card">
                    <label for="">Enter Amount</label>
                    <div class="input-wraper">
                        <img src="./assests/dolor.svg" alt="">
                        <input type="number" class="amount-input" placeholder="e.g 100"  value="1">
                    </div>
                        <div class="currency-btns">
                        <button class="pkr-btn btn"><img src="./assests/pkr.svg" alt="">PKR <img src="down.svg" alt=""></button>
                        <button class="inr-btn btn"><img src="./assests/inr.svg" alt="">INR <img src="down.svg" alt=""></button>
                        <button class="sar-btn btn"><img src="./assests/sar.svg" alt="">SAR <img src="down.svg" alt=""></button>
                    </div>
                    <div class="convert-btn">
                        <button class="convert-btn button"><img src="/assests/arrow.svg" alt="">Convert Currency</button>
                    </div>
                    <div class="result-card">
                        <div class="result-header">
                            <span>Conversion Amount</span>
                            <h2>0.00</h2>
                        </div>
                        <img src="./assests/coins.svg" alt="">
                    </div>
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
